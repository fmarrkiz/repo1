<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <link rel="stylesheet" href="sass/main.css">
    <title>Carousel</title>
   
</head>
<body>

    <header>
        <h1> Space Landscape : The beginning of a journey </h1>
    </header>
<article class="Carousel">

  <button type="button" class="previous"> &#10094; </button>
  <button type="button" class="next">&#10095; </button>
  
    <section class="CarouselContainer" >
        <div class="CarouselSlide" id="slide1">         
        <img src="./img/space1.jpg" alt="Space" height="200" width="500"/>
        </div> 

        <div class="CarouselSlide" id="slide2">
        <img src="./img/space2-carinanebula3.jpg" alt="Space" height="200" width="500" />
        </div>

       <div class="CarouselSlide" id="slide3">
        <img src="./img/space3.jpg" alt="Space" height="200" width="500"/>
        </div>

        <div class="CarouselSlide" id="slide4">
        <img src="./img/space4.jpg" alt="Image of a Nebula" height="200" width="500"/>
        </div>
    </section>
</article>
     <script src="js/main.js"> 
     </script>
</body>
</html>
